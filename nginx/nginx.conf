# Reverse proxy — AI Governance Engine.
#
# Point d'entree unique : le navigateur ne parle qu'a ce serveur, qui
# repartit entre le frontend et l'API. Frontend et backend partagent donc
# la meme origine, ce qui rend CORS inutile de ce cote-la.
#
# Ce fichier est un bloc "server", pas une configuration nginx complete
# (ni "events", ni "http") : il doit etre monte dans le repertoire des
# configurations de site, et non a la place de /etc/nginx/nginx.conf.
#
#     volumes:
#       - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
#
# "frontend" et "backend" sont les noms de services docker-compose,
# resolus par le DNS interne du reseau Docker.

server {
    listen 80;

    # Frontend React.
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend API.
    #
    # proxy_pass sans slash final : nginx transmet l'URI complete, prefixe
    # compris. /api/v1/health arrive donc au backend tel quel, ce qui
    # correspond au prefixe declare dans main.py. Ajouter un slash final
    # ("http://backend:8000/") ferait retirer /api/ a nginx, et toutes les
    # requetes tomberaient en 404.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Une analyse enchaine un clone, Checkov et des dizaines d'appels
        # LLM : elle se compte en minutes. Le defaut de nginx est de 60s,
        # qui couperait la connexion en plein travail et renverrait un 504
        # alors que le backend continue de tourner.
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}
