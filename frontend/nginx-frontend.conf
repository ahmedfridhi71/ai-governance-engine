# Service des fichiers statiques du frontend.
#
# React Router gere la navigation cote client : le serveur ne connait que
# "/". Sans la regle try_files ci-dessous, un rechargement direct sur
# /analyze ou /history renverrait un 404, puisque aucun fichier ne porte
# ce nom sur le disque.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Fichier reel, puis dossier, puis repli sur index.html : c'est ce
        # dernier cas qui laisse React Router resoudre la route.
        try_files $uri $uri/ /index.html;
    }
}
